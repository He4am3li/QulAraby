name: Whiteboard Firestore security

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'services/whiteboardCloud.ts'
      - 'pages/Whiteboard.tsx'
      - 'tests/whiteboard-firestore.integration.test.mjs'
      - '.github/workflows/whiteboard-security.yml'

permissions:
  contents: read

jobs:
  whiteboard-firestore-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --no-save --legacy-peer-deps @firebase/rules-unit-testing@5 firebase-tools@14
      - name: Validate whiteboard rules against Firebase Emulator
        run: npx firebase emulators:exec --only firestore --project demo-qul-whiteboard-security "node --test tests/whiteboard-firestore.integration.test.mjs"
