name: Calligraphy Regression and Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'components/whiteboard/Calligraphy*.tsx'
      - 'components/whiteboard/calligraphy*.ts'
      - 'tests/calligraphy-regression.test.mjs'
      - 'package.json'
      - '.github/workflows/calligraphy-checks.yml'

permissions:
  contents: read

jobs:
  calligraphy:
    name: Test calligraphy and compile the app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Calligraphy regressions
        run: npm run test:calligraphy
      - name: Compile production assets
        run: npx vite build
