name: Inspect real avatar compositing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-actual-avatar-compositing.yml'

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pillow
      - name: Composite cropped transparency on actual pale scene
        run: |
          python - <<'PY'
          from PIL import Image,ImageDraw,ImageFilter
          from pathlib import Path
          root=Path('public/avatars/original-rigs')
          dest=Path('public/avatars/edge-review')
          for case in ['uae/male','saudi/female','syria/male','egypt/male','morocco/female']:
              cut=Image.open(root/case/'cutout.webp').convert('RGBA')
              for suffix,portrait in [('current',cut)]:
                  frame=Image.new('RGB', (480,830),'#edf5f1')
                  x=int((480-portrait.width)/2)
                  y=int((800-portrait.height))
                  shadow=Image.new('RGBA',frame.size,(0,0,0,0))
                  d=ImageDraw.Draw(shadow)
                  d.ellipse((160,795,330,812),fill=(23,55,47,80))
                  shadow=shadow.filter(ImageFilter.GaussianBlur(10))
                  frame.paste(shadow,(0,0),shadow)
                  frame.paste(portrait,(x,y),portrait)
                  dst=dest/(case.replace('/','_')+'_actualpreview.jpg')
                  frame.save(dst,quality=87)
                  print(case,dst)
          PY
      - name: Commit explicit compositing samples
        run: |
          git config user.name "QUL Composite Review"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/avatars/edge-review
          git commit -m "Create real-background reference composites of five avatar cutouts"
          git push origin HEAD:main
