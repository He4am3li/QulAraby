name: Firestore security boundaries, emulator

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'tests/firestore-security-emulator.test.mjs'
      - 'components/CollaborativeBoard.tsx'
      - '.github/workflows/firestore-security-emulator.yml'

permissions:
  contents: read

jobs:
  rules-permissions:
    name: 26 real-role access checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install production dependencies
        run: npm ci
      - name: Install temporary emulator test tools
        run: npm install --no-save --no-package-lock --legacy-peer-deps @firebase/rules-unit-testing@5.0.2 firebase-tools@15.35.0
      - name: Test Firestore rules without production credentials
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
        run: npx --no-install firebase emulators:exec --project demo-qul-security-rules --only firestore --non-interactive "node tests/firestore-security-emulator.test.mjs"
      - name: Confirm application build remains valid
        run: npm run lint && npm run build
