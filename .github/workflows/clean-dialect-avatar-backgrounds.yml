name: Clean dialect portrait backgrounds

on:
  push:
    branches: [main]
    paths:
      - 'scripts/create-transparent-dialect-avatars.py'
      - '.github/workflows/clean-dialect-avatar-backgrounds.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clean-qul-dialect-portraits
  cancel-in-progress: false

jobs:
  create-cutouts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache background removal model
        uses: actions/cache@v4
        with:
          path: ~/.rembg
          key: rembg-u2net-human-seg-v1

      - name: Install CPU-based segmentation dependencies
        run: |
          python -m pip install --disable-pip-version-check 'rembg[cpu]==2.0.80' 'pillow>=10' 'numpy<3' 'opencv-python-headless'

      - name: Remove dark photo backdrops and yellow haloes
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          python scripts/create-transparent-dialect-avatars.py --expected 43 --model u2net_human_seg

      - name: Publish only verified transparent cutouts
        run: |
          set -euo pipefail
          git config user.name "QUL Portrait Publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/avatars/original-rigs
          if git diff --cached --quiet; then
            echo "Cutouts unchanged"
            exit 0
          fi
          git commit -m "Publish transparent cutouts with grounded character presentation"
          git push origin HEAD:main
