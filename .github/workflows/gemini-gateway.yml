name: Secure Gemini gateway

on:
  pull_request:
    paths:
      - 'api/**'
      - 'services/gemini.ts'
      - 'services/dialectFlagOrbPalette.mjs'
      - 'components/DialectVoiceOrb.tsx'
      - 'components/DialectVoiceOrb.css'
      - 'components/DialectFlagGlassArt.tsx'
      - 'tests/dialect-voice-lab.test.mjs'
      - 'pages/Dialects.tsx'
      - 'pages/Speak.tsx'
      - 'pages/Preparation.tsx'
      - 'pages/Quizzes.tsx'
      - 'vite.config.ts'
      - 'tests/gemini-gateway.test.mjs'
      - 'tests/secret-exposure.test.mjs'
      - 'scripts/audit-client-secrets.mjs'
      - '.gitignore'
      - 'package.json'
      - '.github/workflows/gemini-gateway.yml'
  push:
    branches:
      - 'fix/gemini-server-gateway-20261103'

permissions:
  contents: read

jobs:
  secure-gateway:
    name: TypeScript, security and production bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:secrets
      - name: Confirm Firebase Admin loads without ESM require interop
        run: node --no-experimental-require-module -e "require('firebase-admin/auth')"
      - run: npm run lint
      - run: npm run test:gateway
      - run: npm run build
