name: Pilot localized expression layers
on:
  push:
    branches: [main]
    paths: ['scripts/pilot-dialect-facial-sprites.py', '.github/workflows/pilot-dialect-facial-sprites.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  faces:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check 'mediapipe==0.10.21' 'numpy<2' pillow
      - run: python scripts/pilot-dialect-facial-sprites.py
      - name: Publish pilot samples only for review
        run: |
          git config user.name "QUL Rig Research"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/avatars/rig-probe
          git commit -m "Preview pilot independent blink and mouth expression overlays"
          git push origin HEAD:main
