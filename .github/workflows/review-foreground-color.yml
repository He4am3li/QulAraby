name: Review foreground color refinement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/review-foreground-color.yml'

permissions:
  contents: write

jobs:
  grabcut-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pillow numpy opencv-python-headless
      - name: Refine 5 silhouettes using color edges
        run: |
          python - <<'PY'
          import numpy as np, cv2
          from pathlib import Path
          from PIL import Image
          root=Path('public/avatars/original-rigs')
          out=Path('public/avatars/edge-review')
          for who in ['uae/male','saudi/female','syria/male','morocco/female','egypt/male']:
              src=np.asarray(Image.open(root/who/'source.webp').convert('RGB'))
              rgb=cv2.cvtColor(src,cv2.COLOR_RGB2BGR)
              h,w=src.shape[:2]
              alpha=np.asarray(Image.open(root/who/'cutout.webp').convert('RGBA'))[:,:,3]
              # Original mask was cropped to the person. Re-align with its
              # visible foreground by regenerating predicted position from
              # original dimensions and portrait bounding box.
              # The original source cropped WebP preserves exact source pixels,
              # so locate its top-left by normalized cross correlation.
              small=np.asarray(Image.open(root/who/'cutout.webp').convert('RGBA'))
              cropRGB=small[:,:,:3]
              m=(small[:,:,3]>230).astype(np.uint8)
              yy,xx=np.where(m>0)
              if len(xx)<200:
                  print(who,'cannot align');continue
              cy,cx=int(np.median(yy)),int(np.median(xx))
              patch=cropRGB[cy-8:cy+9,cx-8:cx+9]
              if patch.shape[:2]!=(17,17): print(who,'bad patch'); continue
              score=cv2.matchTemplate(src,patch,cv2.TM_SQDIFF_NORMED)
              _,_,location,_=cv2.minMaxLoc(score)
              cropX,cropY=location[0]-(cx-8),location[1]-(cy-8)
              aligned=np.zeros((h,w),np.uint8)
              x0=max(0,cropX);y0=max(0,cropY)
              x1=min(w,cropX+small.shape[1]);y1=min(h,cropY+small.shape[0])
              if x1<=x0 or y1<=y0:print(who,'alignment failed');continue
              aligned[y0:y1,x0:x1]=small[y0-cropY:y1-cropY,x0-cropX:x1-cropX,3]
              mask=np.full((h,w),cv2.GC_PR_BGD,np.uint8)
              mask[aligned>85]=cv2.GC_PR_FGD
              mask[aligned<10]=cv2.GC_BGD
              mask[:3,:]=cv2.GC_BGD;mask[-3:,:]=cv2.GC_BGD
              mask[:,:3]=cv2.GC_BGD;mask[:,-3:]=cv2.GC_BGD
              foreground=(aligned>245).astype('uint8')
              dist=cv2.distanceTransform(foreground,cv2.DIST_L2,3)
              cxcoords=np.linspace(0,1,w)[None,:]
              ycoords=np.linspace(0,1,h)[:,None]
              # Anchor the central head/torso, never the former background halo.
              center=np.logical_and(cxcoords>.28,cxcoords<.72)
              face=np.logical_and(ycoords>.06,ycoords<.39)
              core=np.logical_and(center,np.logical_or(face,ycoords>.4))
              mask[(dist>15)&core]=cv2.GC_FGD
              b=np.zeros((1,65),np.float64);f=np.zeros((1,65),np.float64)
              try:cv2.grabCut(rgb,mask,None,b,f,6,cv2.GC_INIT_WITH_MASK)
              except Exception as e:print(who,'grabCut failed',str(e));continue
              guess=np.isin(mask,[cv2.GC_FGD,cv2.GC_PR_FGD]).astype(np.uint8)*255
              # Keep the largest contiguous person silhouette.
              n,labels,stats,_=cv2.connectedComponentsWithStats(guess)
              if n>1:guess=(labels==1+np.argmax(stats[1:,cv2.CC_STAT_AREA])).astype('uint8')*255
              guess=cv2.GaussianBlur(guess,(3,3),.65)
              guess=np.minimum(guess,aligned)
              y,x=np.where(guess>40)
              if not len(x):print(who,'empty');continue
              left,right,top,bottom=x.min(),x.max(),y.min(),y.max()
              pad=12
              left=max(0,left-pad);right=min(w,right+pad+1)
              top=max(0,top-pad);bottom=min(h,bottom+pad+1)
              pic=np.concatenate([src,guess[...,None]],axis=-1)[top:bottom,left:right]
              dest=out/(who.replace('/','_')+'_grabcut.webp')
              Image.fromarray(pic).save(dest,'WEBP',quality=94,method=5)
              print(who,'output',dest, 'foreground',int(np.count_nonzero(guess>128)))
          PY
      - name: Save revised samples
        run: |
          git config user.name "QUL Segmentation Review"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/avatars/edge-review
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Compare color-refined portrait silhouettes"
          git push origin HEAD:main
