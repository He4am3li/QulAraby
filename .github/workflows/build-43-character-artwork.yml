name: Generate 43 original-pixel editable character artwork

on:
  push:
    branches:
      - feat/dialect-43-editable-artwork-batch-20261101
    paths:
      - 'scripts/build-43-character-artwork.py'
      - 'scripts/character-artwork-requirements.txt'
      - 'scripts/export-43-character-psd.sh'
      - 'scripts/audit-character-psds.py'
      - '.github/workflows/build-43-character-artwork.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-editable-layers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/character-artwork-requirements.txt
      - name: Install local computer-vision tools
        run: python -m pip install -r scripts/character-artwork-requirements.txt
      - name: Create 43 editable ORA portraits and verify neutral image fidelity
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          python scripts/build-43-character-artwork.py --expected 43 --preview
      - name: Summarize verified output
        if: always()
        run: |
          if [ -f artifacts/qul-43-layer-drafts/batch-report.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('artifacts/qul-43-layer-drafts/batch-report.json').read_text())
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## QUL editable artwork, 43 characters\n\n')
              f.write(f"Original neutral image pixels preserved: {data['pixel_perfect_neutral']}/{data['count']}\n\n")
              f.write(f"Face landmarks detected: {data['face_detected']}/{data['count']}\n\n")
              f.write(f"Pose landmarks detected: {data['pose_detected']}/{data['count']}\n\n")
              f.write('**These are editable preparation drafts, NOT approved Live2D rigs.**\n')
          PY
          fi
      - name: Preserve ALL source-safe drafts as downloadable artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QUL-43-original-pixel-editable-ORA-drafts
          path: artifacts/qul-43-layer-drafts/
          retention-days: 30
          if-no-files-found: error

  convert-editable-psd:
    needs: build-editable-layers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download the 43 verified editable ORA masters
        uses: actions/download-artifact@v4
        with:
          name: QUL-43-original-pixel-editable-ORA-drafts
          path: artifacts/qul-43-layer-drafts
      - name: Install Krita headless editor and PSD audit tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq krita xvfb
          python3 -m pip install --disable-pip-version-check 'pillow>=10' 'numpy<2' 'psd-tools==1.10.0'
      - name: Export actual multilayer PSD files and test source image fidelity
        env:
          QT_LOGGING_RULES: "*.debug=false"
          OMP_NUM_THREADS: "2"
        run: bash scripts/export-43-character-psd.sh artifacts/qul-43-layer-drafts artifacts/qul-43-psd-drafts
      - name: Publish 43 editable PSD files separately (not Cubism-certified)
        uses: actions/upload-artifact@v4
        with:
          name: QUL-43-original-pixel-layered-PSD-drafts
          path: artifacts/qul-43-psd-drafts
          retention-days: 30
          if-no-files-found: error
