name: Review silhouette edge confidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/review-dialect-edge-confidence.yml'

permissions:
  contents: write

jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Build edge trimming comparisons
        run: |
          python - <<'PY'
          from PIL import Image
          import numpy as np
          from pathlib import Path
          root=Path('public/avatars/original-rigs')
          preview=Path('public/avatars/edge-review')
          preview.mkdir(exist_ok=True,parents=True)
          for who in ['uae/male','saudi/female','syria/male','morocco/female','egypt/male']:
              original=Image.open(root/who/'cutout.webp').convert('RGBA')
              rgb=np.asarray(original).copy()
              a=rgb[:,:,3].astype('float32')
              for threshold in (90,140,185,210):
                  result=rgb.copy()
                  result[:,:,3]=np.clip((a-threshold)*255/(255-threshold),0,255).astype('uint8')
                  output=preview/(who.replace('/','_')+'_'+str(threshold)+'.webp')
                  Image.fromarray(result,'RGBA').save(output,'WEBP',quality=96,method=5)
                  print(output,output.stat().st_size)
          PY
      - name: Save review assets
        run: |
          git config user.name "QUL Edge Review"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/avatars/edge-review
          git commit -m "Add transparent edge confidence comparisons for 5 character portraits"
          git push origin HEAD:main
