name: Probe preserved portrait face landmarks
on:
  push:
    branches: [main]
    paths: ['scripts/probe-dialect-face-landmarks.py']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install --disable-pip-version-check 'mediapipe==0.10.21' 'numpy<2' pillow
      - run: python scripts/probe-dialect-face-landmarks.py
      - name: Publish non-production landmark previews
        run: |
          git config user.name "QUL Rig Probe"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/avatars/rig-probe
          git commit -m "Preview facial landmark alignment on original cultural characters"
          git push origin HEAD:main
