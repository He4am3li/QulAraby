name: Align Juha word timings
on:
  push:
    branches: [feature/audio-word-alignment-20261027]
    paths:
      - scripts/align_juha_words.py
      - .github/workflows/align-juha-words.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install 'whisperx==3.3.1' 'soundfile>=0.12'
      - name: Force-align actual audio with written transcript
        run: python scripts/align_juha_words.py
      - name: Save report even on failed alignments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juha-alignment-report
          path: alignment-report.json
          if-no-files-found: ignore
      - name: Commit verified alignments to feature branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/storyCassettes.ts alignment-report.json
          git diff --cached --quiet || git commit -m "Add measured Juha word timing boundaries"
          git push
