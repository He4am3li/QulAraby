<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Qul - Smart Language Learning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Inter:wght@300;400;500;600;700&family=Aref+Ruqaa:wght@400;700&family=Zain:wght@200;300;400;700;800&family=Amiri:wght@400;700&family=Cairo:wght@400;700;900&family=Almarai:wght@300;400;700;800&family=Lalezar&family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet">
    <style>
      /* Responsive Layout Fixes */
      html, body {
        height: 100%;
        /* نلغي القفل في الموبايل للسماح بالتمرير عند الحاجة */
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: none;
      }
      
      @media (min-width: 1024px) {
        body {
          overflow: hidden;
          position: fixed;
          inset: 0;
        }
      }

      body {
        font-family: 'Inter', 'Tajawal', sans-serif;
        background-color: #f8fafc;
        width: 100%;
        -webkit-tap-highlight-color: transparent;
      }

      /* تحسين حجم الخطوط العربية في الشاشات الصغيرة */
      .arabic-font { font-family: 'Tajawal', sans-serif; }
      
      .arabic-font, [dir="rtl"] {
        letter-spacing: 0 !important;
        line-height: 1.6;
      }

      /* Falling Rain Letters - Adjusted for Mobile Performance */
      @keyframes rainFall {
        0% { transform: translateY(-10vh); opacity: 0; }
        10% { opacity: 0.2; }
        90% { opacity: 0.2; }
        100% { transform: translateY(110vh); opacity: 0; }
      }

      .falling-char {
        position: absolute;
        color: rgba(255, 255, 255, 0.3);
        pointer-events: none;
        animation: rainFall linear infinite;
        z-index: 0;
        font-weight: 800;
        user-select: none;
        will-change: transform, opacity;
        /* تقليل الحجم في الموبايل */
        font-size: 1.2rem;
      }

      @media (min-width: 768px) {
        .falling-char { font-size: 2rem; }
      }

      /* Glass Card & UI Elements */
      .glass-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.4);
      }

      /* Responsive Container Adjustments */
      .app-container {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      @media (min-width: 1024px) {
        .app-container {
          flex-direction: row;
        }
      }

      /* منع تداخل العناصر مع لوحة مفاتيح الهاتف */
      @media (max-height: 500px) {
        .no-overlap { display: none; }
      }

      /* الخطوط المتخصصة */
      .font-amiri { font-family: 'Amiri', serif; }
      .font-cairo { font-family: 'Cairo', sans-serif; }
      .font-almarai { font-family: 'Almarai', sans-serif; }
      .font-lalezar { font-family: 'Lalezar', system-ui; }
      .font-reem { font-family: 'Reem Kufi', sans-serif; }
      .font-tajawal { font-family: 'Tajawal', sans-serif; }
      .font-aref { font-family: 'Aref Ruqaa', serif; }
      .font-zain { font-family: 'Zain', sans-serif; }
    </style>
  </head>
  <body class="bg-pattern-dots">
    <div class="noor-noise"></div>
    
    <div id="root" class="app-container relative z-10 w-full min-h-full"></div>

    <script type="module" src="/index.tsx"></script>
  </body>
</html>
