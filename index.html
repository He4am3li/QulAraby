
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qul - Smart Language Learning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Inter:wght@300;400;500;600;700&family=Aref+Ruqaa:wght@400;700&family=Zain:wght@200;300;400;700;800&family=Courier+Prime:wght@400;700&family=Amiri:wght@400;700&family=Cairo:wght@400;700;900&family=Almarai:wght@300;400;700;800&family=Lalezar&family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet">
    <style>
      html, body {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        font-family: 'Inter', 'Tajawal', sans-serif;
        background-color: #f8fafc;
        position: fixed;
        inset: 0;
        width: 100%;
      }
      .arabic-font {
        font-family: 'Tajawal', sans-serif;
      }
      
      /* Global fix for Arabic letter spacing to ensure connectivity */
      .arabic-font, 
      .font-amiri, 
      .font-cairo, 
      .font-almarai, 
      .font-lalezar, 
      .font-reem, 
      .font-tajawal, 
      .font-aref, 
      .font-zain, 
      .font-farah,
      [dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3, [dir="rtl"] h4, [dir="rtl"] p, [dir="rtl"] span, [dir="rtl"] button {
        letter-spacing: 0 !important;
      }
      .font-amiri { font-family: 'Amiri', serif; }
      .font-cairo { font-family: 'Cairo', sans-serif; }
      .font-almarai { font-family: 'Almarai', sans-serif; }
      .font-lalezar { font-family: 'Lalezar', system-ui; }
      .font-reem { font-family: 'Reem Kufi', sans-serif; }
      .font-tajawal { font-family: 'Tajawal', sans-serif; }
      .font-aref { font-family: 'Aref Ruqaa', serif; }
      .font-zain { font-family: 'Zain', sans-serif; }
      .font-farah { font-family: 'Farah', 'Tajawal', sans-serif; }
      .handwritten-font {
        font-family: 'Aref Ruqaa', serif;
      }
      .typewriter-font {
        font-family: 'American Typewriter', 'Courier Prime', 'Courier New', Courier, monospace;
      }
      /* Custom scrollbars for better visibility */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: #cbd5e1 transparent;
      }

      /* Falling Rain Letters Animation - Performance Optimized */
      @keyframes rainFall {
        0% { transform: translateY(-20vh); opacity: 0; }
        5% { opacity: 0.3; }
        98% { opacity: 0.3; }
        100% { transform: translateY(120vh); opacity: 0; }
      }

      .falling-char {
        position: absolute;
        color: rgba(255, 255, 255, 0.4);
        font-family: 'Tajawal', sans-serif;
        pointer-events: none;
        animation: rainFall linear infinite;
        z-index: 0;
        font-weight: 800;
        user-select: none;
        text-shadow: 0 0 5px rgba(255, 255, 255, 0.2);
        white-space: nowrap;
        will-change: transform, opacity;
      }

      .sidebar-gradient {
        background: linear-gradient(to left, #0f172a 0%, #064e3b 100%);
      }

      @media print {
        @page { margin: 20mm; }
        body { overflow: visible !important; background: white !important; }
        .no-print { display: none !important; }
        .print-only { display: block !important; }
        .print-container { width: 100% !important; margin: 0 !important; padding: 0 !important; direction: rtl !important; }
        .chat-item { page-break-inside: avoid; margin-bottom: 15px; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; }
        .tip-box {
          background-color: #f0fdf4 !important;
          border: 2px solid #059669 !important;
          padding: 20px !important;
          border-radius: 12px !important;
          margin-bottom: 20px !important;
          -webkit-print-color-adjust: exact;
        }
      }
      .print-only { display: none; }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-4px) rotate(-0.5deg); }
        75% { transform: translateX(4px) rotate(0.5deg); }
      }
      .animate-shake {
        animation: shake 0.15s cubic-bezier(.36,.07,.19,.97) both;
      }

      /* Professional Background Patterns */
      .bg-pattern-waves {
        background-color: #f8fafc;
        background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                          radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                          radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
        background-attachment: fixed;
      }

      .bg-pattern-dots {
        background-color: #f8fafc;
        background-image: radial-gradient(#e2e8f0 1.5px, transparent 1.5px);
        background-size: 30px 30px;
      }

      .bg-pattern-grid {
        background-color: #f8fafc;
        background-image: linear-gradient(#f1f5f9 1.5px, transparent 1.5px), linear-gradient(90deg, #f1f5f9 1.5px, transparent 1.5px);
        background-size: 50px 50px;
      }

      .bg-pattern-mesh {
        background-color: #4158D0;
        background-image: linear-gradient(43deg, #4158D0 0%, #C850C0 46%, #FFCC70 100%);
      }

      .bg-pattern-soft {
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      }

      /* Magical "Noor" Texture & Effects */
      .noor-noise {
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        opacity: 0.015;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }

      /* Card Flip Effect for Word Journey */
      .flip-card {
        perspective: 1000px;
      }
      .flip-card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        transition: transform 0.6s;
        transform-style: preserve-3d;
      }
      .flip-card:hover .flip-card-inner {
        transform: rotateY(180deg);
      }
      .flip-card-front, .flip-card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 1.5rem;
      }
      .flip-card-back {
        transform: rotateY(180deg);
      }

      .magical-glow {
        box-shadow: 0 0 30px rgba(37, 99, 235, 0.05), 0 0 100px rgba(37, 99, 235, 0.02);
      }

      /* Custom Hover Underline Effect */
      .nav-line-hover {
        position: relative;
        display: inline-block;
      }

      .nav-line-hover::after,
      .nav-line-hover::before {
        content: '';
        position: absolute;
        width: 100%;
        height: 2px;
        background: linear-gradient(to right, #ff0000, #00ffff);
        bottom: -2px;
        left: 0;
        transform: scaleX(0);
        transform-origin: right;
        transition: transform 0.4s ease-out;
      }

      .nav-line-hover::before {
        top: -2px;
        bottom: auto;
        transform-origin: left;
      }

      .nav-line-hover:hover::after,
      .nav-line-hover:hover::before {
        transform: scaleX(1);
      }

      /* Optimized transitions */
      .transition-standard {
        transition: background-color 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
      }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
